# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: quantification
description: Run the selected quantifiers and aggregate gene- and circular-transcript
  expression outputs.
keywords:
  - circRNA
  - analysis
  - workflow
components:
  - combinebeds/counts
  - psirc_quant
  - ciriquant
  - ciri3_quant
input:
  - reads:
      type: file
      description: "Per-sample sequencing reads; paired-end samples carry both FASTQ
        files in the reads field.


        Structure: [ val(meta), path(reads) ]"
      pattern: "*.{fastq,fastq.gz,fq,fq.gz}"
  - ch_gtf:
      type: file
      description: "Reference genome GTF annotation channel.


        Structure: [ val(meta), path(gtf) ]"
      pattern: "*.{gtf,gtf.gz}"
  - ch_fasta:
      type: file
      description: "Reference genome FASTA channel.


        Structure: [ val(meta), path(fasta) ]"
      pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
  - ch_transcriptome_fasta:
      type: file
      description: "Combined linear/circular transcriptome FASTA.


        Structure: [ val(meta), path(fasta) ]"
      pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
  - ch_transcriptome_gtf:
      type: file
      description: "Combined linear/circular transcriptome GTF annotation.


        Structure: [ val(meta), path(gtf) ]"
      pattern: "*.{gtf,gtf.gz}"
  - circ_annotation_bed:
      type: file
      description: "Collected list of circular RNA BED12 annotation tuples from BSJ_DETECTION.


        Structure: [ val(annotation_tuples) ]; each item: [ val(meta), path(bed12) ]"
      pattern: "*.{bed,bed.gz}"
  - _circ_annotation_gtf:
      type: file
      description: "GTF annotation channel accepted for compatibility but unused by
        this workflow.


        Structure: [ val(meta), path(gtf) ]"
  - ch_bsj_bed_per_sample_tool:
      type: file
      description: "Per-sample, per-caller back-splice junction BED channel.


        Structure: [ val(meta), path(file) ]"
      pattern: "*.{bed,bed.gz}"
  - bootstrap_samples:
      type: value
      description: "Number of bootstrap samples for kallisto. Structure: [ val(bootstrap_samples)
        ]"
  - ch_phenotype:
      type: file
      description: "Sample phenotype table.


        Structure: [ val(meta), path(file) ]"
  - ch_faidx:
      type: file
      description: "Reference FASTA index (FAI) channel.


        Structure: [ val(meta), path(file) ]"
      pattern: "*.fai"
  - bwa_index:
      type: file
      description: "BWA index channel emitted by PREPARE_GENOME.


        Structure: [ val(meta), path(index_files) ]"
  - hisat2_index:
      type: file
      description: "HISAT2 index channel emitted by PREPARE_GENOME.


        Structure: [ val(meta), path(index_files) ]"
  - tools:
      type: value
      description: "Names of selected analysis tools. Structure: [ val(tools) ]"
  - max_shift:
      type: value
      description: "Maximum genomic coordinate shift allowed while merging calls. Structure:
        [ val(max_shift) ]"
  - consider_strand:
      type: value
      description: "Whether strand is considered when merging calls. Structure: [ val(consider_strand)
        ]"
  - ch_bwa_sam:
      type: file
      description: "BWA-aligned SAM channel used by CIRI3 quantification.


        Structure: [ val(meta), path(sam) ]"
output:
  - gene:
      type: file
      description: "Gene-level quantification matrices from enabled quantifiers; metadata
        records the quantification method.


        Structure: [ val(meta), path(matrix) ]"
  - circ:
      type: file
      description: "Circular-transcript quantification matrices from enabled quantifiers;
        metadata records the quantification method.


        Structure: [ val(meta), path(matrix) ]"
  - ciriquant:
      type: file
      description: "Raw per-sample CIRIquant GTF results.


        Structure: [ val(meta), path(gtf) ]"
  - stringtie:
      type: file
      description: "Per-sample StringTie gene GTF results generated by CIRIquant.


        Structure: [ val(meta), path(gtf) ]"
  - rds:
      type: file
      description: "Merged RDS quantification object emitted by psirc quantification.


        Structure: [ val(meta), path(rds) ]"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
