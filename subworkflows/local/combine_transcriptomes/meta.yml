# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: combine_transcriptomes
description: Combine transcriptomes processing workflow for circRNA analysis.
keywords:
  - circRNA
  - analysis
  - workflow
components:
  - gnu/sort
  - gawk
  - gffread
input:
  - ch_genome_fasta:
      type: file
      description: "Reference genome FASTA channel.


        Structure: [ val(meta), path(file) ]"
  - ch_genome_gtf:
      type: file
      description: "Reference genome GTF annotation channel.


        Structure: [ val(meta), path(gtf) ]"
      pattern: "*.{gtf,gtf.gz}"
  - ch_circ_gtf:
      type: file
      description: "Circular RNA transcript GTF annotation channel.


        Structure: [ val(meta), path(file) ]"
output:
  - fasta:
      type: file
      description: "Combined genome and circular transcript FASTA generated by gffread.


        Structure: [ val(meta), path(fasta) ]"
      pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
  - gtf:
      type: file
      description: "Combined GTF after filtering overlong transcripts.


        Structure: [ val(meta), path(gtf) ]"
      pattern: "*.{gtf,gtf.gz}"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
