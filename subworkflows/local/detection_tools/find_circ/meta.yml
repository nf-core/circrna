# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: find_circ
description: Find circ processing workflow for circRNA analysis.
keywords:
  - circRNA
  - analysis
  - workflow
components:
  - bowtie2/align
  - samtools/view
  - samtools/index
  - find/circ/anchors
  - find/circ
  - bioawk
  - csvtk/summary
  - csvtk/join
  - gawk
input:
  - reads:
      type: file
      description: "Per-sample sequencing reads; paired-end samples carry both FASTQ
        files in the reads field.


        Structure: [ val(meta), path(reads) ]"
      pattern: "*.{fastq,fastq.gz,fq,fq.gz}"
  - bowtie2_index:
      type: file
      description: "Bowtie2 index channel.


        Structure: [ val(meta), path(file) ]"
  - ch_fasta:
      type: file
      description: "Reference genome FASTA channel.


        Structure: [ val(meta), path(fasta) ]"
      pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
output:
  - bed:
      type: file
      description: "Per-sample find_circ back-splice junction BED calls.


        Structure: [ val(meta), path(file) ]"
      pattern: "*.{bed,bed.gz}"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
