# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: ciri2
description: Ciri2 processing workflow for circRNA analysis.
keywords:
  - circRNA
  - analysis
  - workflow
components:
  - ciri2
  - gawk
input:
  - ch_sam:
      type: file
      description: "BWA-aligned SAM channel.


        Structure: [ val(meta), path(file) ]"
      pattern: "*.sam"
  - ch_fasta:
      type: file
      description: "Reference genome FASTA channel.


        Structure: [ val(meta), path(fasta) ]"
      pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
  - ch_gtf:
      type: file
      description: "Reference genome GTF annotation channel.


        Structure: [ val(meta), path(gtf) ]"
      pattern: "*.{gtf,gtf.gz}"
output:
  - bed:
      type: file
      description: "Per-sample unified CIRI2 back-splice junction BED calls.


        Structure: [ val(meta), path(file) ]"
      pattern: "*.{bed,bed.gz}"
  - ciri2_txt:
      type: file
      description: "CIRI2 text results passed to CIRI-full.


        Structure: [ val(meta), path(file) ]"
  - ciri2_sam:
      type: file
      description: "BWA SAM alignments passed through for CIRI-full.


        Structure: [ val(meta), path(file) ]"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
