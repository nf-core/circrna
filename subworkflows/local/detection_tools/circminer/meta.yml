# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: circminer
description: Circminer processing workflow for circRNA analysis.
keywords:
  - circRNA
  - analysis
  - workflow
components:
  - circminer/circminer
  - gawk
  - infer/strand
input:
  - reads:
      type: file
      description: "Per-sample sequencing reads; paired-end samples carry both FASTQ
        files in the reads field.


        Structure: [ val(meta), path(reads) ]"
      pattern: "*.{fastq,fastq.gz,fq,fq.gz}"
  - index:
      type: file
      description: "Reference index file(s) required by the named caller.


        Structure: [ val(meta), path(file) ]"
      pattern: "*.{idx,sec}"
  - gtf:
      type: file
      description: "Circular RNA call annotations in GTF format.


        Structure: [ val(meta), path(gtf) ]"
      pattern: "*.{gtf,gtf.gz}"
  - fasta:
      type: file
      description: "FASTA sequences extracted for the relevant circular RNA transcripts.


        Structure: [ val(meta), path(fasta) ]"
      pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
  - faidx:
      type: file
      description: "Reference FASTA index (FAI) channel.


        Structure: [ val(meta), path(file) ]"
      pattern: "*.fai"
output:
  - bed:
      type: file
      description: "Per-sample circMiner BED calls with inferred strand.


        Structure: [ val(meta), path(file) ]"
      pattern: "*.{bed,bed.gz}"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
