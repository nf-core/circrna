name: infer_strand
description: Infer transcript strand from genomic annotation and read alignment
keywords:
  - strand
  - annotation
  - pysam
tools:
  - pysam:
      description: Python interface to htslib
      homepage: https://github.com/pysam-developers/pysam
      licence:
        - MIT
input:
  - - "meta":
        type: map
        description: Sample metadata
    - "bed":
        type: file
        description: BED records
  - - "refmeta":
        type: map
        description: Reference metadata
    - "fasta":
        type: file
        description: Reference FASTA
    - "fai":
        type: file
        description: FASTA index
output:
  bed:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}.bed":
          type: file
          description: Strand-annotated BED records
  versions:
    - versions.yml:
        type: file
        description: YAML file containing versions of tools used in the module
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
