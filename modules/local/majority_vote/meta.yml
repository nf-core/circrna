name: majority_vote
description: Retain miRNA target predictions supported by a minimum number of tools.
keywords:
  - mirna
  - target-prediction
  - consensus
tools:
  - polars:
      description: Fast DataFrame library for Python.
      homepage: https://pola.rs/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Binding-site metadata.
    - bindingsites:
        type: file
        description: Predicted miRNA binding sites.
        pattern: "*.{tsv,txt}"
  - min_tools:
      type: integer
      description: Minimum supporting prediction tools.
output:
  tsv:
    - - "meta":
          type: map
          description: Binding-site metadata.
      - "${meta.id}.majority.tsv":
          type: file
          description: Consensus miRNA-target pairs.
          pattern: "*.majority.tsv"
  targets:
    - - "meta":
          type: map
          description: Binding-site metadata.
      - "${meta.id}.targets.tsv":
          type: file
          description: Targets grouped by miRNA.
          pattern: "*.targets.tsv"
  versions_python:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python":
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //'":
          type: eval
          description: Software version
  versions_polars:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "polars":
          type: string
          description: The name of the tool
      - "python -c 'import polars; print(polars.__version__)'":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Software name
      - python --version | sed 's/Python //':
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - polars:
          type: string
          description: Software name
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
