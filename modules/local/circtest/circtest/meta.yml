name: circtest_circtest
description: Test circular-to-linear RNA ratios between experimental conditions.
keywords:
  - circtest
  - circrna
  - differential-expression
tools:
  - r-base:
      description: R statistical computing environment.
      homepage: https://www.r-project.org/
      licence:
        - GPL-2.0-or-later
  - aod:
      description: R analysis of overdispersed data package.
      homepage: https://cran.r-project.org/package=aod
      licence:
        - GPL-2.0-or-later
  - plyr:
      description: R tools for splitting and combining data.
      homepage: https://cran.r-project.org/package=plyr
      licence:
        - MIT
  - ggplot2:
      description: R data visualisation package.
      homepage: https://ggplot2.tidyverse.org/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Count metadata.
    - gene_counts:
        type: file
        description: Gene count matrix.
        pattern: "*.{tsv,txt}"
    - circ_counts:
        type: file
        description: CircRNA count matrix.
        pattern: "*.{tsv,txt}"
  - - meta2:
        type: map
        description: Phenotype metadata.
    - phenotype:
        type: file
        description: Sample phenotype table.
        pattern: "*.{csv,tsv}"
output:
  summary:
    - - "meta":
          type: map
          description: Count metadata.
      - "${prefix}_summary.txt":
          type: file
          description: CircTest summary.
          pattern: "*_summary.txt"
  plots:
    - - "meta":
          type: map
          description: Count metadata.
      - "*.pdf":
          type: file
          description: CircTest plots.
          pattern: "*.pdf"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
authors:
  - "@nictru"
maintainers:
  - "@nictru"
