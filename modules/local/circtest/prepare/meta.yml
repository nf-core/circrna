name: circtest_prepare
description: Prepare gene and circRNA count matrices for CircTest.
keywords:
  - circtest
  - circrna
  - normalization
tools:
  - r-base:
      description: R statistical computing environment.
      homepage: https://www.r-project.org/
      licence:
        - GPL-2.0-or-later
input:
  - - meta:
        type: map
        description: Sample metadata.
    - gene_counts:
        type: file
        description: Gene count matrix.
        pattern: "*.{tsv,txt}"
    - circ_counts:
        type: file
        description: CircRNA count matrix.
        pattern: "*.{tsv,txt}"
output:
  counts:
    - - meta:
          type: map
          description: Sample metadata.
      - genes:
          type: file
          description: Prepared gene counts.
          pattern: "*_genes.tsv"
      - circs:
          type: file
          description: Prepared circRNA counts.
          pattern: "*_circs.tsv"
  versions_r_base:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-base:
          type: string
          description: The name of the tool
      - R --version | sed "1!d; s/.*version //; s/ .*//":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - r-base:
          type: string
          description: Software name
      - R --version | sed "1!d; s/.*version //; s/ .*//":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
