name: combinebeds_filter
description: Filter combined circRNA BED records by tool and sample support.
keywords:
  - circrna
  - bed
  - filtering
tools:
  - polars:
      description: Fast DataFrame library for Python.
      homepage: https://pola.rs/
      licence:
        - MIT
  - upsetplot:
      description: Set visualisation library.
      homepage: https://upsetplot.readthedocs.io/
      licence:
        - BSD-3-Clause
  - matplotlib:
      description: Python plotting library.
      homepage: https://matplotlib.org/
      licence:
        - PSF-2.0
input:
  - - meta:
        type: map
        description: Sample metadata.
    - beds:
        type: file
        description: Combined BED records.
        pattern: "*.bed"
  - max_shift:
      type: integer
      description: Maximum junction-coordinate shift.
  - consider_strand:
      type: boolean
      description: Include strand in matching.
  - min_tools:
      type: integer
      description: Minimum supporting tools.
  - min_samples:
      type: integer
      description: Minimum supporting samples.
  - suffix:
      type: string
      description: Output filename suffix.
output:
  combined:
    - - "meta":
          type: map
          description: Sample metadata.
      - "${prefix}.${suffix}":
          type: file
          description: Filtered BED records.
          pattern: "*.bed"
  plots:
    - "*.png":
        type: file
        description: Support plots.
        pattern: "*.png"
  multiqc:
    - "*.json":
        type: file
        description: MultiQC custom-content data.
        pattern: "*.json"
  versions_python:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python":
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //'":
          type: eval
          description: Software version
  versions_polars:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "polars":
          type: string
          description: The name of the tool
      - "python -c 'import polars; print(polars.__version__)'":
          type: eval
          description: Software version
  versions_upsetplot:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "upsetplot":
          type: string
          description: The name of the tool
      - "python -c 'import upsetplot; print(upsetplot.__version__)'":
          type: eval
          description: Software version
  versions_matplotlib:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "matplotlib":
          type: string
          description: The name of the tool
      - "python -c 'import matplotlib; print(matplotlib.__version__)'":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Software name
      - python --version | sed 's/Python //':
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - polars:
          type: string
          description: Software name
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - upsetplot:
          type: string
          description: Software name
      - python -c 'import upsetplot; print(upsetplot.__version__)':
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - matplotlib:
          type: string
          description: Software name
      - python -c 'import matplotlib; print(matplotlib.__version__)':
          type: eval
          description: Software version
authors:
