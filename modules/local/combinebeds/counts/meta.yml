name: combinebeds_counts
description: Aggregate circRNA candidate counts from BED files.
keywords:
  - circrna
  - bed
  - aggregation
tools:
  - polars:
      description: Fast DataFrame library for Python.
      homepage: https://pola.rs/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Sample metadata.
    - aggregation:
        type: string
        description: Aggregation mode.
    - candidates:
        type: file
        description: Candidate circRNA BED file.
        pattern: "*.bed"
    - beds:
        type: file
        description: Input BED files.
        pattern: "*.bed"
  - max_shift:
      type: integer
      description: Maximum junction-coordinate shift.
  - consider_strand:
      type: boolean
      description: Include strand in matching.
output:
  combined:
    - - "meta":
          type: map
          description: Sample metadata.
      - "${prefix}.tsv":
          type: file
          description: Aggregated count table.
          pattern: "*.tsv"
  versions_python:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python":
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //'":
          type: eval
          description: Software version
  versions_polars:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "polars":
          type: string
          description: The name of the tool
      - "python -c 'import polars; print(polars.__version__)'":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Software name
      - python --version | sed 's/Python //':
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - polars:
          type: string
          description: Software name
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
