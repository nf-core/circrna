name: combinebeds_shifts
description: Visualise coordinate shifts among combined circRNA BED records.
keywords:
  - circrna
  - bed
  - visualisation
tools:
  - polars:
      description: Fast DataFrame library for Python.
      homepage: https://pola.rs/
      licence:
        - MIT
  - altair:
      description: Declarative statistical visualisation library.
      homepage: https://altair-viz.github.io/
      licence:
        - BSD-3-Clause
input:
  - - meta:
        type: map
        description: Sample metadata.
    - beds:
        type: file
        description: Combined BED records.
        pattern: "*.bed"
output:
  plots:
    - - meta:
          type: map
          description: Sample metadata.
      - "*.png":
          type: file
          description: Coordinate-shift plots.
          pattern: "*.png"
  multiqc:
    - - meta:
          type: map
          description: Sample metadata.
      - "*.json":
          type: file
          description: MultiQC custom-content data.
          pattern: "*.json"
  versions:
    - versions.yml:
        type: file
        description: YAML file containing versions of tools used in the module
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
