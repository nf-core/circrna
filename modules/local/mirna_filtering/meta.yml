name: mirna_filtering
description: Filter lowly expressed miRNAs from a normalised count matrix.
keywords:
  - mirna
  - filtering
  - expression
tools:
  - r-base:
      description: R statistical computing environment.
      homepage: https://www.r-project.org/
      licence:
        - GPL-2.0-or-later
input:
  - - meta:
        type: map
        description: Count metadata.
    - normalized_counts:
        type: file
        description: Normalised miRNA count matrix.
        pattern: "*.{tsv,txt}"
  - mirna_min_sample_percentage:
      type: float
      description: Minimum fraction of samples expressing a miRNA.
  - mirna_min_reads:
      type: integer
      description: Minimum reads required in a sample.
output:
  filtered:
    - - "meta":
          type: map
          description: Count metadata.
      - "${meta.id}.normalized_counts_filtered.tsv":
          type: file
          description: Filtered normalised count matrix.
          pattern: "*.normalized_counts_filtered.tsv"
  versions_r_base:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "r-base":
          type: string
          description: The name of the tool
      - 'R --version | sed "1!d; s/.*version //; s/ .*//"':
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - r-base:
          type: string
          description: Software name
      - R --version | sed "1!d; s/.*version //; s/ .*//":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
