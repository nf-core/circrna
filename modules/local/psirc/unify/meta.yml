name: psirc_unify
description: Convert psiRC full-length isoform output to BED12
keywords:
  - psirc
  - bed
  - annotation
tools:
  - pandas:
      description: Data analysis library
      homepage: https://pandas.pydata.org/
      licence:
        - BSD-3-Clause
input:
  - - meta:
        type: map
        description: Sample metadata
    - isoforms_tsv:
        type: file
        description: psiRC full-length isoform table
output:
  bed:
    - - meta:
          type: map
          description: Sample metadata
      - "*.bed":
          type: file
          description: BED12 circRNA calls
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | cut -d " " -f2:
          type: eval
          description: Software version
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - python -c "import pandas as pd; print(pd.__version__)":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Software name
      - python --version | cut -d " " -f2:
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - pandas:
          type: string
          description: Software name
      - python -c "import pandas as pd; print(pd.__version__)":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
