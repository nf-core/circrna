name: psirc_bsj_unify
description: Convert psiRC junction calls to BED with resolved strands
keywords:
  - psirc
  - bsj
  - bed
tools:
  - python:
      description: Programming language
      homepage: https://python.org/
      licence:
        - PSF-2.0
input:
  - - meta:
        type: map
        description: Sample metadata
    - bed:
        type: file
        description: psiRC junction calls
  - - transcriptome_meta:
        type: map
        description: Transcriptome metadata
    - transcriptome:
        type: file
        description: Custom transcriptome FASTA
output:
  bed:
    - - meta:
          type: map
          description: Sample metadata
      - "*.bed":
          type: file
          description: Strand-resolved junctions
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | cut -d " " -f2:
          type: eval
          description: Software version
topics:
