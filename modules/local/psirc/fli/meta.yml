name: psirc_fli
description: Infer full-length linear and circular RNA isoforms with psiRC
keywords:
  - psirc
  - circrna
  - isoform
tools:
  - psirc:
      description: Full-length circular RNA detection
      homepage: https://github.com/Christina-hshi/psirc
      licence:
        - MIT
        - BSD-3-Clause
        - BSD-2-Clause
        - LicenseRef-kallisto-b-non-commercial
  - kallisto_b:
      description: psiRC bundled kallisto fork
      homepage: https://github.com/Christina-hshi/psirc
      licence:
        - LicenseRef-kallisto-b-non-commercial
input:
  - - meta:
        type: map
        description: Sample metadata
    - reads:
        type: file
        description: RNA-seq reads
    - bsj:
        type: directory
        description: psiRC BSJ output directory
  - - meta2:
        type: map
        description: Transcriptome metadata
    - transcriptome:
        type: file
        description: Custom transcriptome FASTA
output:
  fasta:
    - - meta:
          type: map
          description: Sample metadata
      - "*.fa":
          type: file
          description: Full-length isoforms
  sam:
    - - meta:
          type: map
          description: Sample metadata
      - "*.sam":
          type: file
          description: Supporting alignments
  tsv:
    - - meta:
          type: map
          description: Sample metadata
      - "*.tsv":
          type: file
          description: Isoform table
  versions_psirc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - psirc:
          type: string
          description: The name of the tool
      - 1.0.0:
          type: string
          description: Software version
  versions_kallisto_b:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kallisto_b:
          type: string
          description: The name of the tool
      - kallisto_b version | sed "s/.*version //":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - psirc:
          type: string
          description: Software name
      - 1.0.0:
          type: string
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - kallisto_b:
          type: string
          description: Software name
      - kallisto_b version | sed "s/.*version //":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
