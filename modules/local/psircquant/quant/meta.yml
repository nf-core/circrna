name: psircquant_quant
description: Quantify circular and linear transcript abundances with psiRC-quant
keywords:
  - psirc
  - quantification
  - expression
tools:
  - psirc-quant:
      description: Quantify circular and linear transcripts
      homepage: https://github.com/Christina-hshi/psirc
      licence:
        - MIT
        - BSD-3-Clause
        - BSD-2-Clause
        - LicenseRef-kallisto-b-non-commercial
input:
  - - "meta":
        type: map
        description: Sample metadata
    - "reads":
        type: file
        description: RNA-seq reads
  - - "meta2":
        type: map
        description: Index metadata
    - "index":
        type: file
        description: psiRC-quant index
  - - "meta3":
        type: map
        description: Annotation metadata
    - "gtf":
        type: file
        description: Transcript annotation
  - - "meta4":
        type: map
        description: Reference metadata
    - "chrom_sizes":
        type: file
        description: Chromosome sizes
  - "bootstrap_samples":
      type: integer
      description: Bootstrap replicates
output:
  directory:
    - - "meta":
          type: map
          description: Sample metadata
      - "${meta.id}":
          type: directory
          description: Quantification output
  versions_psircquant:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "psirc-quant":
          type: string
          description: The name of the tool
      - "psirc-quant version | sed -n \"s/^psirc-quant, version \\([0-9.]*\\).*$/\\1/p\"":
          type: eval
          description: Software version
topics:
  versions:
    - - "${task.process}":
          type: string
          description: Process name
      - "psirc-quant":
          type: string
          description: Software name
      - "psirc-quant version | sed -n \"s/^psirc-quant, version \\([0-9.]*\\).*$/\\1/p\"":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
