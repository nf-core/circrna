name: psircquant_index
description: Build a psiRC-quant index
keywords:
  - psirc
  - quantification
  - index
tools:
  - psirc-quant:
      description: Quantify circular and linear transcripts
      homepage: https://github.com/Christina-hshi/psirc
      licence:
        - MIT
        - BSD-3-Clause
        - BSD-2-Clause
        - LicenseRef-kallisto-b-non-commercial
input:
  - - meta:
        type: map
        description: Transcriptome metadata
    - fasta:
        type: file
        description: Transcriptome FASTA
output:
  index:
    - - meta:
          type: map
          description: Transcriptome metadata
      - psirc.index:
          type: file
          description: psiRC-quant index
  versions_psircquant:
    - - ${task.process}:
          type: string
          description: The name of the process
      - psirc-quant:
          type: string
          description: The name of the tool
      - psirc-quant version | sed -n "s/^psirc-quant, version \\([0-9.]*\\).*$/\\1/p":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - psirc-quant:
          type: string
          description: Software name
      - psirc-quant version | sed -n "s/^psirc-quant, version \\([0-9.]*\\).*$/\\1/p":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
