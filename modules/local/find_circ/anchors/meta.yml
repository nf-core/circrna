name: find_circ_anchors
description: Extract unmapped read anchors for find_circ
keywords:
  - find_circ
  - anchors
  - circular-rna
tools:
  - find_circ:
      description: Circular RNA detection pipeline
      homepage: https://github.com/marvin-jens/find_circ
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Sample metadata
    - bam:
        type: file
        description: Alignment BAM file
        pattern: "*.bam"
output:
  anchors:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}_anchors.qfa.gz":
          type: file
          description: Compressed read anchors
  versions_find_circ:
    - - "${task.process}":
          type: string
          description: Process name
      - "find_circ":
          type: string
          description: Software name
      - "1.2":
          type: string
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - find_circ:
          type: string
          description: Software name
      - "1.2":
          type: string
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
