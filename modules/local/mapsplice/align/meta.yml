name: mapsplice_align
description: Align RNA-seq reads and identify fusion junctions with MapSplice
keywords:
  - mapsplice
  - alignment
  - fusion
tools:
  - mapsplice:
      description: RNA-seq alignment and junction detection
      homepage: https://sourceforge.net/projects/mapsplice/
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Sample metadata
    - reads:
        type: file
        description: Single- or paired-end reads
  - bowtie_index:
      type: directory
      description: Bowtie index
  - - meta:
        type: map
        description: Reference metadata
    - chromosomes:
        type: directory
        description: Chromosome FASTA files
  - gtf:
      type: file
      description: Gene annotation
output:
  raw_fusions:
    - - meta:
          type: map
          description: Sample metadata
      - fusions_raw.txt:
          type: file
          description: Raw fusion junction calls
  versions_mapsplice:
    - - ${task.process}:
          type: string
          description: Process name
      - mapsplice:
          type: string
          description: Software name
      - 2.2.1:
          type: string
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - mapsplice:
          type: string
          description: Software name
      - 2.2.1:
          type: string
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
