name: compute_correlations
description: Compute miRNA and transcript-expression correlations for predicted targets.
keywords:
  - mirna
  - correlation
  - circrna
tools:
  - r-base:
      description: R statistical computing environment.
      homepage: https://www.r-project.org/
      licence:
        - GPL-2.0-or-later
  - fishpond:
      description: Inferential-replicate RNA-seq analysis package.
      homepage: https://bioconductor.org/packages/fishpond/
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Binding-site metadata.
    - bindingsites:
        type: file
        description: miRNA target binding-site table.
        pattern: "*.{tsv,txt}"
  - - meta2:
        type: map
        description: miRNA-expression metadata.
    - mirna_expression:
        type: file
        description: miRNA expression matrix.
        pattern: "*.{tsv,txt}"
  - - meta3:
        type: map
        description: Transcript-expression metadata.
    - transcript_rds:
        type: file
        description: Transcript SummarizedExperiment RDS.
        pattern: "*.rds"
  - correlation_method:
      type: string
      description: Correlation method passed to fishpond swish (pearson or spearman).
output:
  correlations:
    - - meta:
          type: map
          description: Binding-site metadata.
      - "*.tsv":
          type: file
          description: Correlation results by miRNA.
          pattern: "*.tsv"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
authors:
  - "@nictru"
maintainers:
  - "@nictru"
