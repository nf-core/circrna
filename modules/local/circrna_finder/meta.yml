name: circrna_finder
description: Filter STAR chimeric junctions with circRNA_finder
keywords:
  - circrna_finder
  - star
  - circular-rna
tools:
  - gawk:
      description: Pattern scanning and processing language
      homepage: https://www.gnu.org/software/gawk/
      licence:
        - GPL-3.0-or-later
  - coreutils:
      description: GNU basic file
      shell and text utilities: null
      homepage: https://www.gnu.org/software/coreutils/
      licence:
        - GPL-3.0-or-later
  - circrna_finder:
      description: Circular RNA detection workflow
      homepage: https://github.com/marvin-jens/circrna_finder
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Sample metadata
    - star_input:
        type: directory
        description: STAR alignment output
output:
  results:
    - - meta:
          type: map
          description: Sample metadata
      - "*.filteredJunctions.bed":
          type: file
          description: Filtered STAR junctions
  versions_awk:
    - - ${task.process}:
          type: string
          description: Process name
      - awk:
          type: string
          description: Software name
      - awk --version | head -n1 | cut -d' ' -f3 | sed 's/,//g':
          type: eval
          description: Software version
  versions_cat:
    - - ${task.process}:
          type: string
          description: Process name
      - cat:
          type: string
          description: Software name
      - cat --version | head -n1 | sed 's/cat (GNU coreutils) //':
          type: eval
          description: Software version
  versions_circrna_finder:
    - - ${task.process}:
          type: string
          description: Process name
      - circRNA_finder:
          type: string
          description: Software name
      - "1.2":
          type: string
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - awk:
          type: string
          description: Software name
      - awk --version | head -n1 | cut -d' ' -f3 | sed 's/,//g':
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - cat:
          type: string
          description: Software name
      - cat --version | head -n1 | sed 's/cat (GNU coreutils) //':
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - circRNA_finder:
          type: string
          description: Software name
      - "1.2":
          type: string
          description: Software version
