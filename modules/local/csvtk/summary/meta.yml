name: csvtk_summary
description: Summarize a delimited table with csvtk
keywords:
  - csvtk
  - summary
  - table
tools:
  - csvtk:
      description: Toolkit for tabular data
      homepage: https://github.com/shenwei356/csvtk
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Sample metadata
    - csv:
        type: file
        description: Input CSV or TSV table
output:
  csv:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}.${out_extension}":
          type: file
          description: Summary table
  versions_csvtk:
    - - "${task.process}":
          type: string
          description: Process name
      - "csvtk":
          type: string
          description: Software name
      - 'csvtk version | sed "s/csvtk v//"':
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - csvtk:
          type: string
          description: Software name
      - csvtk version | sed "s/csvtk v//":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
