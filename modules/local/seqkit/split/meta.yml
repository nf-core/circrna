name: seqkit_split
description: Split a FASTA file into smaller files with SeqKit
keywords:
  - seqkit
  - fasta
  - split
tools:
  - seqkit:
      description: Sequence toolkit
      homepage: https://bioinf.shenwei.me/seqkit/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Sample metadata
    - fasta:
        type: file
        description: Input FASTA file
        pattern: "*.{fa,fasta}"
output:
  split:
    - - meta:
          type: map
          description: Sample metadata
      - "*":
          type: file
          description: Split FASTA files
  versions_seqkit:
    - - ${task.process}:
          type: string
          description: Process name
      - seqkit:
          type: string
          description: Software name
      - "seqkit version | sed 's/^seqkit v//'":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - seqkit:
          type: string
          description: Software name
      - "seqkit version | sed 's/^seqkit v//'":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
