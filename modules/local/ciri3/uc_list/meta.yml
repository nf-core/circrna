name: ciri3_uc_list
description: Build a CIRI3 circRNA list from a BED12 annotation
keywords:
  - ciri3
  - circrna
  - bed
tools:
  - polars:
      description: Fast DataFrame library for Python
      homepage: https://pola.rs/
      documentation: https://docs.pola.rs/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Annotation metadata
    - bed:
        type: file
        description: BED12 circRNA annotation
        pattern: "*.{bed,bed12}"
output:
  list:
    - - "meta":
          type: map
          description: Annotation metadata
      - "${prefix}.ciri3.list":
          type: file
          description: CIRI3 circRNA list
          pattern: "*.ciri3.list"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
