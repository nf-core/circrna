name: ciri3_uc_matrix
description: Normalize CIRI3 BSJ and FSJ counts against the consensus candidate list
keywords:
  - ciri3
  - circrna
  - matrix
tools:
  - polars:
      description: Fast DataFrame library for Python
      homepage: https://pola.rs/
      documentation: https://docs.pola.rs/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: CircRNA annotation metadata
    - circ_list:
        type: file
        description: CIRI3 circRNA list
        pattern: "*.ciri3.list"
  - - meta2:
        type: map
        description: Sample metadata
    - bsj_matrix:
        type: file
        description: CIRI3 back-splice junction count matrix
        pattern: "*.BSJ_Matrix"
    - fsj_matrix:
        type: file
        description: CIRI3 forward-splice junction count matrix
        pattern: "*.FSJ_Matrix"
output:
  bsj:
    - - "meta2":
          type: map
          description: Sample metadata
      - "${prefix}.bsj.tsv":
          type: file
          description: Back-splice junction counts with absent consensus candidates zero-filled
          pattern: "*.bsj.tsv"
  fsj:
    - - "meta2":
          type: map
          description: Sample metadata
      - "${prefix}.fsj.tsv":
          type: file
          description: Forward-splice junction counts with absent consensus candidates zero-filled
          pattern: "*.fsj.tsv"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/python_polars:708bbfa3590a8658
      build_id: bd-708bbfa3590a8658_1
