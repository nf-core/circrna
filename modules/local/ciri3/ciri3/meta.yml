name: ciri3_ciri3
description: Detect circRNAs or quantify a supplied circRNA candidate list with CIRI3
keywords:
  - ciri3
  - circrna
  - detection
  - quantification
tools:
  - ciri3:
      description: CircRNA identification and quantification
      homepage: https://github.com/gyjames/CIRI3
      licence:
        - GPL-2.0-only
input:
  - - meta:
        type: map
        description: Sample metadata
    - sam:
        type: file
        description: Alignment SAM file
        pattern: "*.sam"
  - - meta2:
        type: map
        description: Reference metadata
    - fasta:
        type: file
        description: Reference FASTA
        pattern: "*.{fa,fasta}"
  - - meta3:
        type: map
        description: Annotation metadata
    - gtf:
        type: file
        description: Gene annotation
        pattern: "*.gtf"
  - circ_list:
      type: file
      description: Optional CIRI3 candidate list; pass an empty list for discovery
output:
  txt:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}.ciri3.txt":
          type: file
          description: CIRI3 result
  bsj_matrix:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}.ciri3.txt.BSJ_Matrix":
          type: file
          description: BSJ matrix
  fsj_matrix:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}.ciri3.txt.FSJ_Matrix":
          type: file
          description: FSJ matrix
  versions_ciri3:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "ciri3":
          type: string
          description: The name of the tool
      - "3.0.1":
          type: string
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - ciri3:
          type: string
          description: Software name
      - 3.0.1:
          type: string
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
