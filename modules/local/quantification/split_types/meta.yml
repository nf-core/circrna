name: split_types
description: Split a quantification matrix into circular and linear records.
keywords:
  - quantification
  - circrna
  - matrix
tools:
  - gawk:
      description: GNU implementation of awk.
      homepage: https://www.gnu.org/software/gawk/
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Matrix metadata.
    - input:
        type: file
        description: Quantification matrix.
        pattern: "*.{tsv,txt}"
output:
  linear:
    - - meta:
          type: map
          description: Matrix metadata.
      - linear.tsv:
          type: file
          description: Linear RNA quantification records.
          pattern: linear.tsv
  circular:
    - - meta:
          type: map
          description: Matrix metadata.
      - circular.tsv:
          type: file
          description: Circular RNA quantification records.
          pattern: circular.tsv
  versions_gawk:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - gawk --version | sed -n '1s/,.*//p' | cut -d ' ' -f 3:
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - gawk:
          type: string
          description: Software name
      - gawk --version | sed -n '1s/,.*//p' | cut -d ' ' -f 3:
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
