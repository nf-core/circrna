name: merge_experiments
description: Merge transcript quantification experiments and annotate their rows.
keywords:
  - quantification
  - summarizedexperiment
  - rtracklayer
tools:
  - summarizedexperiment:
      description: Bioconductor container for experimental assays.
      homepage: https://bioconductor.org/packages/SummarizedExperiment/
      licence:
        - Artistic-2.0
  - rtracklayer:
      description: R interface to genome browsers and annotations.
      homepage: https://bioconductor.org/packages/rtracklayer/
      licence:
        - Artistic-2.0
input:
  - - meta:
        type: map
        description: Experiment metadata.
    - experiments:
        type: file
        description: Quantification experiment RDS files.
        pattern: "*.rds"
  - - meta2:
        type: map
        description: Phenotype metadata.
    - phenotype:
        type: file
        description: Sample phenotype table.
        pattern: "*.{csv,tsv}"
  - - meta3:
        type: map
        description: Annotation metadata.
    - gtf:
        type: file
        description: Transcript annotation GTF.
        pattern: "*.gtf"
  - - meta4:
        type: map
        description: TPM metadata.
    - tpm:
        type: file
        description: Transcript TPM matrix.
        pattern: "*.{tsv,txt}"
output:
  merged:
    - - "meta":
          type: map
          description: Experiment metadata.
      - "${meta.id}.merged.rds":
          type: file
          description: Merged annotated experiment.
          pattern: "*.merged.rds"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
authors:
  - "@nictru"
maintainers:
  - "@nictru"
