name: mirna_targets
description: Combine miRanda and TargetScan miRNA target predictions
keywords:
  - mirna
  - target
  - bedtools
tools:
  - gawk:
      description: Pattern scanning and processing language
      homepage: https://www.gnu.org/software/gawk/
      licence:
        - GPL-3.0-or-later
  - bedtools:
      description: Utilities for genome arithmetic
      homepage: https://bedtools.readthedocs.io/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Sample metadata
    - targetscan:
        type: file
        description: TargetScan predictions
    - miranda:
        type: file
        description: miRanda predictions
output:
  results:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}.mirna_targets.txt":
          type: file
          description: Combined miRNA target predictions
  versions_awk:
    - - "${task.process}":
          type: string
          description: Process name
      - "awk":
          type: string
          description: Software name
      - "awk --version | head -n1 | cut -d' ' -f3 | sed 's/,//g'":
          type: eval
          description: Software version
  versions_bedtools:
    - - "${task.process}":
          type: string
          description: Process name
      - "bedtools":
          type: string
          description: Software name
      - 'bedtools --version | sed "s/bedtools v//"':
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - awk:
          type: string
          description: Software name
      - awk --version | head -n1 | cut -d' ' -f3 | sed 's/,//g':
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - bedtools:
          type: string
          description: Software name
      - bedtools --version | sed "s/bedtools v//":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
