name: pygtftk_tabulate
description: Tabulate selected fields from a GTF annotation
keywords:
  - pygtftk
  - gtf
  - tabulate
tools:
  - pygtftk:
      description: Toolkit for GTF/GFF files
      homepage: https://github.com/dputhier/pygtftk
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Annotation metadata
    - gtf:
        type: file
        description: Gene annotation
        pattern: "*.gtf"
output:
  table:
    - - "meta":
          type: map
          description: Annotation metadata
      - "${outfile}":
          type: file
          description: Tabulated annotation fields
  versions_gtftk:
    - - "${task.process}":
          type: string
          description: Process name
      - "gtftk":
          type: string
          description: Software name
      - "1.6.2":
          type: string
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - gtftk:
          type: string
          description: Software name
      - 1.6.2:
          type: string
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
