name: tximeta_tximeta
description: Import transcript quantifications into a tximeta SummarizedExperiment.
keywords:
  - tximeta
  - quantification
  - summarizedexperiment
tools:
  - tximeta:
      description: Transcript quantification import with metadata.
      homepage: https://bioconductor.org/packages/tximeta/
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Sample metadata.
    - quants:
        type: file
        description: Quantification files staged beneath quants.
        pattern: "*"
  - quant_type:
      type: string
      description: Quantification tool type.
output:
  se:
    - - meta:
          type: map
          description: Sample metadata.
      - "*.rds":
          type: file
          description: tximeta SummarizedExperiment.
          pattern: "*.rds"
  versions_bioconductor_tximeta:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bioconductor-tximeta:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(packageVersion('tximeta')))":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - bioconductor-tximeta:
          type: string
          description: Software name
      - Rscript -e "cat(as.character(packageVersion('tximeta')))":
          type: eval
          description: Software version
