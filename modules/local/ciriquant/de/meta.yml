name: ciriquant_de
description: Test CIRIquant circRNA and gene matrices for differential expression
keywords:
  - ciriquant
  - differential-expression
  - edger
tools:
  - ciriquant:
      description: CircRNA quantification from the pinned nictru fork
      homepage: https://github.com/nictru/CIRIquant
      licence:
        - MIT
  - edger:
      description: Differential expression analysis of digital gene expression data
      homepage: https://bioconductor.org/packages/edgeR/
      licence:
        - GPL-2.0-or-later
input:
  - - meta:
        type: map
        description: Comparison metadata
    - library:
        type: file
        description: CIRIquant library table
    - expression:
        type: file
        description: BSJ expression matrix
    - gene:
        type: file
        description: Gene expression matrix
output:
  circ:
    - - meta:
          type: map
          description: Comparison metadata
      - "*.circ.csv":
          type: file
          description: CircRNA DE results
  gene:
    - - meta:
          type: map
          description: Comparison metadata
      - "*.gene.csv":
          type: file
          description: Gene DE results
  versions_ciriquant:
    - - ${task.process}:
          type: string
          description: Process name
      - ciriquant:
          type: string
          description: Software name
      - CIRIquant --version 2>&1 | sed "s/CIRIquant //g":
          type: eval
          description: Software version
  versions_r_base:
    - - ${task.process}:
          type: string
          description: Process name
      - r-base:
          type: string
          description: Software name
      - R --version | sed "1!d; s/.*version //; s/ .*//":
          type: eval
          description: Software version
  versions_edger:
    - - ${task.process}:
          type: string
          description: Process name
      - edger:
          type: string
          description: Software name
      - Rscript -e "cat(as.character(packageVersion('edgeR')))":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - ciriquant:
          type: string
          description: Software name
      - CIRIquant --version 2>&1 | sed "s/CIRIquant //g":
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - r-base:
          type: string
          description: Software name
      - R --version | sed "1!d; s/.*version //; s/ .*//":
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - edger:
          type: string
          description: Software name
      - Rscript -e "cat(as.character(packageVersion('edgeR')))":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
containers:
  docker:
    linux/amd64:
      name: docker.io/nicotru/ciriquant@sha256:5e59c7a31355f1814a1703e9cb27d347b7bb04871606a24c1acdacfc02c627f8
      build_id: bd-45acbdd4f4c8b517_1
  singularity:
    linux/amd64:
      name: oras://docker.io/nicotru/ciriquant:35228e054dcad0b0
      build_id: bd-35228e054dcad0b0_1
