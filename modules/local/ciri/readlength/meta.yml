  - ciri
  - read-length
  - qc
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      licence:
        - PSF-2.0
  - polars:
      description: Fast DataFrame library
      homepage: https://pola.rs/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Sample metadata
    - lengths:
        type: file
