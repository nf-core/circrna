name: cirivis_unify
description: Convert CIRI-vis list output to BED
keywords:
  - ciri
  - cirivis
  - bed
tools:
  - pandas:
      description: Data analysis and manipulation library
      homepage: https://pandas.pydata.org/
      licence:
        - BSD-3-Clause
input:
  - - meta:
        type: map
        description: Sample metadata
    - list:
        type: file
        description: CIRI-vis circle list
output:
  bed:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}.bed":
          type: file
          description: Unified BED records
  versions_pandas:
    - - "${task.process}":
          type: string
          description: Process name
      - "pandas":
          type: string
          description: Software name
      - 'python -c "import pandas; print(pandas.__version__)"':
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - pandas:
          type: string
          description: Software name
      - python -c "import pandas; print(pandas.__version__)":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
