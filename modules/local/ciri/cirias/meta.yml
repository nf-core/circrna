name: ciri_cirias
description: Run CIRI-AS alternative splicing analysis
keywords:
  - ciri
  - ciri-as
  - splicing
tools:
  - ciri-as:
      description: Alternative splicing analysis for circRNAs
      homepage: https://sourceforge.net/projects/ciri/
      licence:
        - GPL-3.0-or-later
input:
  - - "meta":
        type: map
        description: Sample metadata
    - "ciri2":
        type: file
        description: CIRI2 calls
    - "sam":
        type: file
        description: Alignment SAM file
  - - "meta2":
        type: map
        description: Reference metadata
    - "fasta":
        type: file
        description: Reference genome
  - - "meta3":
        type: map
        description: Annotation metadata
    - "gtf":
        type: file
        description: Gene annotation
output:
  list:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}_jav.list":
          type: file
          description: CIRI-AS junction list
  library_length:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}_library_length.list":
          type: file
          description: Estimated library lengths
  versions_ciri_as:
    - - "${task.process}":
          type: string
          description: Process name
      - "ciri-as":
          type: string
          description: Software name
      - "1.2":
          type: string
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - ciri-as:
          type: string
          description: Software name
      - "1.2":
          type: string
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
