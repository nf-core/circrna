name: ciri_cirivis
description: Visualize CIRI circular RNA calls
keywords:
  - ciri
  - cirivis
  - visualization
tools:
  - ciri-vis:
      description: CIRI circular RNA visualization tool
      homepage: https://sourceforge.net/projects/ciri/
      licence:
        - GPL-3.0-or-later
input:
  - - "meta":
        type: map
        description: Sample metadata
    - "anno":
        type: file
        description: CIRI annotation
    - "library_length":
        type: file
        description: Library length data
    - "list":
        type: file
        description: Optional circle ID list
  - - "meta2":
        type: map
        description: Reference metadata
    - "fasta":
        type: file
        description: Reference genome
output:
  fasta:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}/${prefix}.list_circle.fa":
          type: file
          description: Optional circular RNA sequences
  list:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}/${prefix}.list":
          type: file
          description: Circle list
  pdf:
    - "${prefix}/*.pdf":
        type: file
        description: Visualization PDF
  versions_ciri_vis:
    - - "${task.process}":
          type: string
          description: Process name
      - "ciri-vis":
          type: string
          description: Software name
      - "1.4.2":
          type: string
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - ciri-vis:
          type: string
          description: Software name
      - 1.4.2:
          type: string
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
