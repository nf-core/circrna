name: join_samples
description: Join per-sample matrices into a single matrix.
keywords:
  - matrix
  - quantification
  - polars
tools:
  - polars:
      description: Fast DataFrame library for Python.
      homepage: https://pola.rs/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Matrix metadata.
    - samples:
        type: list
        description: Sample names matching matrix inputs.
    - matrices:
        type: file
        description: Per-sample matrices.
        pattern: "*.{tsv,csv}"
  - metacols:
      type: string
      description: Comma-separated matrix metadata columns.
output:
  joined:
    - - meta:
          type: map
          description: Matrix metadata.
      - "*.joined.tsv":
          type: file
          description: Joined sample matrix.
          pattern: "*.joined.tsv"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed 's/Python //':
          type: eval
          description: Software version
  versions_polars:
    - - ${task.process}:
          type: string
          description: The name of the process
      - polars:
          type: string
          description: The name of the tool
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Software name
      - python --version | sed 's/Python //':
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - polars:
          type: string
          description: Software name
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
