name: jccirc_jccirc
description: Detect circular RNA from back-splice junctions with JCcirc
keywords:
  - jccirc
  - circular-rna
  - detection
tools:
  - jccirc:
      description: Circular RNA detection software
      homepage: https://github.com/ChengguoXiao/JCcirc
      licence:
        - GPL-3.0-or-later
input:
  - - "meta":
        type: map
        description: Sample metadata
    - "reads":
        type: file
        description: Paired-end reads
    - "bsjs":
        type: file
        description: Back-splice junctions
    - "denovo":
        type: file
        description: De novo junction evidence
  - - "meta2":
        type: map
        description: Reference metadata
    - "fasta":
        type: file
        description: Reference genome
  - - "meta3":
        type: map
        description: Annotation metadata
    - "gtf":
        type: file
        description: Gene annotation
output:
  log:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}.jccirc.log":
          type: file
          description: JCcirc run log
  versions_jccirc:
    - - "${task.process}":
          type: string
          description: Process name
      - "jccirc":
          type: string
          description: Software name
      - "1.0.0":
          type: string
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - jccirc:
          type: string
          description: Software name
      - 1.0.0:
          type: string
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
