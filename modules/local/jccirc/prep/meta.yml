name: jccirc_prep
description: Prepare and merge JCcirc candidate and supporting-read tables
keywords:
  - jccirc
  - preparation
  - merge
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      licence:
        - PSF-2.0
  - polars:
      description: Fast DataFrame library
      homepage: https://pola.rs/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Sample metadata
    - bsj_annotation:
        type: file
        description: Back-splice junction annotations
    - bsj_reads:
        type: file
        description: Supporting reads
output:
  merged:
    - - "meta":
          type: map
          description: Sample metadata
      - "${prefix}.txt":
          type: file
          description: Prepared JCcirc input table
  versions_python:
    - - "${task.process}":
          type: string
          description: Process name
      - "python":
          type: string
          description: Software name
      - 'python --version 2>&1 | sed "s/Python //"':
          type: eval
          description: Software version
  versions_polars:
    - - "${task.process}":
          type: string
          description: Process name
      - "polars":
          type: string
          description: Software name
      - 'python -c "import polars; print(polars.__version__)"':
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Software name
      - python --version 2>&1 | sed "s/Python //":
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - polars:
          type: string
          description: Software name
      - python -c "import polars; print(polars.__version__)":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
