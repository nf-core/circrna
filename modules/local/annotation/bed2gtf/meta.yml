name: annotation_bed2gtf
description: Convert annotated circRNA BED12 records to GTF.
keywords:
  - annotation
  - bed
  - gtf
tools:
  - polars:
      description: Fast DataFrame library for Python.
      homepage: https://pola.rs/
      documentation: https://docs.pola.rs/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Annotation metadata.
    - bed12:
        type: file
        description: Annotated BED12 circRNA records.
        pattern: "*.{bed,bed12}"
    - db_intersections:
        type: file
        description: Optional database-intersection files.
  - exons_only:
      type: boolean
      description: Emit only exon records.
output:
  gtf:
    - - "meta":
          type: map
          description: Annotation metadata.
      - "${prefix}.gtf":
          type: file
          description: GTF annotation converted from BED12.
          pattern: "*.gtf"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
