name: circminer_ordergtf
description: Order AGAT-prepared exons in transcript direction for circMiner
keywords:
  - circminer
  - gtf
  - sorting
tools:
  - gffutils:
      description: Read and write GFF and GTF features
      homepage: https://github.com/daler/gffutils
      documentation: https://daler.github.io/gffutils/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Reference metadata
    - gtf:
        type: file
        description: AGAT GTF3 with genes, transcripts and consecutive genomic-order exon groups
        pattern: "*.gtf"
output:
  gtf:
    - - "meta":
          type: map
          description: Reference metadata
      - "${prefix}.gtf":
          type: file
          description: Gene, transcript and exon records with minus-strand exon groups reversed
          pattern: "*.gtf"
  versions_python:
    - - "${task.process}":
          type: string
          description: Process name
      - "python":
          type: string
          description: Software name
      - 'python --version 2>&1 | sed "s/Python //"':
          type: eval
          description: Software version
  versions_gffutils:
    - - "${task.process}":
          type: string
          description: Process name
      - "gffutils":
          type: string
          description: Software name
      - 'python -c "import gffutils; print(gffutils.__version__)"':
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Software name
      - python --version 2>&1 | sed "s/Python //":
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - gffutils:
          type: string
          description: Software name
      - python -c "import gffutils; print(gffutils.__version__)":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
