name: circminer_index
description: Build a circMiner reference index
keywords:
  - circminer
  - reference
  - index
tools:
  - circminer:
      description: CircRNA detection software
      homepage: https://github.com/rajewsky-lab/circMiner
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Reference metadata
    - fasta:
        type: file
        description: Reference genome
        pattern: "*.{fa,fasta}"
output:
  index:
    - - meta:
          type: map
          description: Reference metadata
      - circminer:
          type: directory
          description: circMiner index directory
  versions_circminer:
    - - ${task.process}:
          type: string
          description: Process name
      - circminer:
          type: string
          description: Software name
      - circminer --version | sed -E "s/^CircMiner //":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - circminer:
          type: string
          description: Software name
      - circminer --version | sed -E "s/^CircMiner //":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
