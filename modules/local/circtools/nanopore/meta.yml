name: circtools_nanopore
description: Detect circular RNA from nanopore reads
keywords:
  - circtools
  - nanopore
  - circular-rna
tools:
  - circtools:
      description: Circular RNA analysis toolkit
      homepage: https://github.com/dieterich-lab/circtools
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Sample metadata
    - reads:
        type: file
        description: Nanopore reads
  - reference:
      type: file
      description: Reference directory
  - genome:
      type: string
      description: Genome identifier
output:
  versions_circtools:
    - - ${task.process}:
          type: string
          description: Process name
      - circtools:
          type: string
          description: Software name
      - circtools -V:
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - circtools:
          type: string
          description: Software name
      - circtools -V:
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
