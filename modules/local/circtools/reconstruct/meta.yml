name: circtools_reconstruct
description: Reconstruct circular RNA events and supporting evidence
keywords:
  - circtools
  - reconstruction
  - circular-rna
tools:
  - circtools:
      description: Circular RNA analysis toolkit
      homepage: https://github.com/dieterich-lab/circtools
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Sample metadata
    - bed:
        type: file
        description: Circular RNA BED
    - bam:
        type: file
        description: Coordinate-sorted BAM
    - bai:
        type: file
        description: BAM index
    - junction:
        type: file
        description: STAR chimeric junctions
  - - meta:
        type: map
        description: Annotation metadata
    - annotation:
        type: file
        description: Gene annotation
output:
  alternative_splicing:
    - - meta:
          type: map
          description: Sample metadata
      - "*.alternative_splicing.txt":
          type: file
          description: Alternative splicing report
  exon_counts_bed:
    - - meta:
          type: map
          description: Sample metadata
      - "*.exon_counts.bed":
          type: file
          description: Exon counts BED
  exon_counts_txt:
    - - meta:
          type: map
          description: Sample metadata
      - "*.exon_counts.txt":
          type: file
          description: Exon counts table
  mate_status:
    - - meta:
          type: map
          description: Sample metadata
      - "*.mate_status.txt":
          type: file
          description: Mate status report
  skipped_exons_bed:
    - - meta:
          type: map
          description: Sample metadata
      - "*.skipped_exons.bed":
          type: file
          description: Skipped exons BED
  skipped_exons_txt:
    - - meta:
          type: map
          description: Sample metadata
      - "*.skipped_exons.txt":
          type: file
          description: Skipped exons table
  bam:
    - - meta:
          type: map
          description: Sample metadata
      - "*.bam":
          type: file
          description: Optional reconstructed BAM files
  coverage_pictures:
    - - meta:
          type: map
          description: Sample metadata
      - "*.pdf":
          type: file
          description: Optional coverage plots
  coverage_profiles_txt:
    - - meta:
          type: map
          description: Sample metadata
      - "*.txt":
          type: file
          description: Optional coverage profiles
  coverage_profiles_pdf:
    - - meta:
          type: map
          description: Sample metadata
      - "*.pdf":
          type: file
          description: Optional coverage profile plots
  coverage_profiles_tsv:
    - - meta:
          type: map
          description: Sample metadata
      - "*.tsv":
          type: file
          description: Optional coverage profile tables
  versions_circtools:
    - - ${task.process}:
          type: string
          description: Process name
      - circtools:
          type: string
          description: Software name
      - circtools -V:
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - circtools:
          type: string
          description: Software name
      - circtools -V:
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
