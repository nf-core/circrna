name: circtools_annotation
description: Convert gene annotation to BED format for circtools
keywords:
  - circtools
  - annotation
  - bed
tools:
  - gtfparse:
      description: Python GTF parser
      homepage: https://github.com/openvax/gtfparse
      licence:
        - MIT
  - polars:
      description: Fast DataFrame library
      homepage: https://pola.rs/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Annotation metadata
    - gtf:
        type: file
        description: Gene annotation
        pattern: "*.gtf"
output:
  bed:
    - - "meta":
          type: map
          description: Annotation metadata
      - "${prefix}.bed":
          type: file
          description: BED annotation
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
