name: circtools_annotation
description: Convert gene annotation to BED format for circtools
keywords:
  - circtools
  - annotation
  - bed
tools:
  - gtfparse:
      description: Python GTF parser
      homepage: https://github.com/openvax/gtfparse
      licence:
        - MIT
  - polars:
      description: Fast DataFrame library
      homepage: https://pola.rs/
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Annotation metadata
    - gtf:
        type: file
        description: Gene annotation
        pattern: "*.gtf"
output:
  bed:
    - - meta:
          type: map
          description: Annotation metadata
      - "*.bed":
          type: file
          description: BED annotation
  versions_python:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Software name
      - python --version 2>&1 | sed "s/Python //":
          type: eval
          description: Software version
  versions_gtfparse:
    - - ${task.process}:
          type: string
          description: Process name
      - gtfparse:
          type: string
          description: Software name
      - python -c "import gtfparse; print(gtfparse.__version__)":
          type: eval
          description: Software version
  versions_polars:
    - - ${task.process}:
          type: string
          description: Process name
      - polars:
          type: string
          description: Software name
      - python -c "import polars; print(polars.__version__)":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Software name
      - python --version 2>&1 | sed "s/Python //":
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - gtfparse:
          type: string
          description: Software name
      - python -c "import gtfparse; print(gtfparse.__version__)":
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - polars:
          type: string
          description: Software name
      - python -c "import polars; print(polars.__version__)":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
