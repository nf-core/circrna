name: circtools_detect
description: Detect circular RNA from STAR junctions with circtools
keywords:
  - circtools
  - detection
  - circular-rna
tools:
  - circtools:
      description: Circular RNA analysis toolkit
      homepage: https://github.com/dieterich-lab/circtools
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Sample metadata
    - paired:
        type: file
        description: Paired STAR junction input
    - mate1:
        type: file
        description: Mate 1 STAR junction input
    - mate2:
        type: file
        description: Mate 2 STAR junction input
  - - meta:
        type: map
        description: Reference metadata
    - fasta:
        type: file
        description: Reference genome
        pattern: "*.{fa,fasta}"
  - - meta:
        type: map
        description: Annotation metadata
    - gtf:
        type: file
        description: Gene annotation
        pattern: "*.gtf"
output:
  reads:
    - - meta:
          type: map
          description: Sample metadata
      - "*_reads.junctions":
          type: file
          description: Detected junction reads
  coordinates:
    - - meta:
          type: map
          description: Sample metadata
      - "*_coordinates.tsv":
          type: file
          description: Circular RNA coordinates
  counts:
    - - meta:
          type: map
          description: Sample metadata
      - "*_counts.tsv":
          type: file
          description: Circular RNA counts
  versions_circtools:
    - - ${task.process}:
          type: string
          description: Process name
      - circtools:
          type: string
          description: Software name
      - circtools -V:
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - circtools:
          type: string
          description: Software name
      - circtools -V:
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
