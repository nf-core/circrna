name: stringtie_prepde
description: Generate gene and transcript count matrices from StringTie assemblies
keywords:
  - stringtie
  - counts
  - matrix
tools:
  - stringtie:
      description: Transcript assembly and quantification
      homepage: https://github.com/gpertea/stringtie
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Group metadata
    - samples:
        type: list
        description: Sample identifiers
    - gtfs:
        type: file
        description: StringTie transcript assemblies
output:
  transcript_matrix:
    - - "meta":
          type: map
          description: Group metadata
      - "${prefix}_transcript_count_matrix.csv":
          type: file
          description: Transcript count matrix
  gene_matrix:
    - - "meta":
          type: map
          description: Group metadata
      - "${prefix}_gene_count_matrix.csv":
          type: file
          description: Gene count matrix
  versions_stringtie:
    - - "${task.process}":
          type: string
          description: Process name
      - "stringtie":
          type: string
          description: Software name
      - "stringtie --version 2>&1":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - stringtie:
          type: string
          description: Software name
      - stringtie --version 2>&1:
          type: eval
          description: Software version
authors:
