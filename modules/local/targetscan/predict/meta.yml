name: targetscan
description: Predict miRNA target sites with TargetScan
keywords:
  - targetscan
  - mirna
  - prediction
tools:
  - gawk:
      description: Pattern scanning and processing language
      homepage: https://www.gnu.org/software/gawk/
      licence:
        - GPL-3.0-or-later
  - targetscan:
      description: miRNA target prediction tools
      homepage: https://www.targetscan.org/
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Reference metadata
    - fasta:
        type: file
        description: Transcript sequences in FASTA
  - - meta:
        type: map
        description: miRNA metadata
    - mature_txt:
        type: file
        description: Mature miRNA sequences
output:
  txt:
    - - meta:
          type: map
          description: Reference metadata
      - "*.txt":
          type: file
          description: TargetScan predictions
  versions_awk:
    - - ${task.process}:
          type: string
          description: Process name
      - awk:
          type: string
          description: Software name
      - awk --version | head -n1 | cut -d' ' -f3 | sed 's/,//g':
          type: eval
          description: Software version
  versions_targetscan:
    - - ${task.process}:
          type: string
          description: Process name
      - targetscan:
          type: string
          description: Software name
      - "7.0":
          type: string
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - awk:
          type: string
          description: Software name
      - awk --version | head -n1 | cut -d' ' -f3 | sed 's/,//g':
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - targetscan:
          type: string
          description: Software name
      - "7.0":
          type: string
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
