name: sjdb
description: Filter and deduplicate STAR splice junction database entries
keywords:
  - star
  - splice-junction
  - filtering
tools:
  - mawk:
      description: Fast AWK implementation
      homepage: https://invisible-island.net/mawk/
      licence:
        - GPL-2.0-or-later
input:
  - - meta:
        type: map
        description: Sample metadata
    - sjdb:
        type: file
        description: STAR splice junction tables
  - bsj_reads:
      type: integer
      description: Minimum back-splice read support
output:
  sjtab:
    - - meta:
          type: map
          description: Sample metadata
      - dataset.SJ.out.tab:
          type: file
          description: Filtered STAR splice junction table
  versions_mawk:
    - - ${task.process}:
          type: string
          description: Process name
      - mawk:
          type: string
          description: Software name
      - mawk -W version 2>&1 | head -n 1:
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - mawk:
          type: string
          description: Software name
      - mawk -W version 2>&1 | head -n 1:
          type: eval
          description: Software version
