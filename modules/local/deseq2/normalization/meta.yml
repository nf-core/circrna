name: deseq2_normalization
description: Normalise miRNA count matrices with DESeq2.
keywords:
  - deseq2
  - mirna
  - normalization
tools:
  - deseq2:
      description: Differential-expression and normalisation package.
      homepage: https://bioconductor.org/packages/DESeq2/
      licence:
        - LGPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Count metadata.
    - counts:
        type: file
        description: miRNA count matrix.
        pattern: "*.{tsv,txt}"
output:
  normalized:
    - - meta:
          type: map
          description: Count metadata.
      - "*.normalized_counts.tsv":
          type: file
          description: DESeq2-normalised count matrix.
          pattern: "*.normalized_counts.tsv"
  versions_bioconductor_deseq2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bioconductor-deseq2:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(packageVersion('DESeq2')))":
          type: eval
          description: Software version
  versions_r_base:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-base:
          type: string
          description: The name of the tool
      - R --version | sed "1!d; s/.*version //; s/ .*//":
          type: eval
          description: Software version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - r-base:
          type: string
          description: Software name
      - R --version | sed "1!d; s/.*version //; s/ .*//":
          type: eval
          description: Software version
    - - ${task.process}:
          type: string
          description: Process name
      - bioconductor-deseq2:
          type: string
          description: Software name
      - Rscript -e "cat(as.character(packageVersion('DESeq2')))":
          type: eval
          description: Software version
authors:
  - "@nictru"
maintainers:
  - "@nictru"
