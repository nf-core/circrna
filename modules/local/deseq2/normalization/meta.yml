name: deseq2_normalization
description: Normalise miRNA count matrices with DESeq2.
keywords:
  - deseq2
  - mirna
  - normalization
tools:
  - deseq2:
      description: Differential-expression and normalisation package.
      homepage: https://bioconductor.org/packages/DESeq2/
      licence:
        - LGPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Count metadata.
    - counts:
        type: file
        description: miRNA count matrix.
        pattern: "*.{tsv,txt}"
output:
  normalized:
    - - "meta":
          type: map
          description: Count metadata.
      - "${meta.id}.normalized_counts.tsv":
          type: file
          description: DESeq2-normalised count matrix.
          pattern: "*.normalized_counts.tsv"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
