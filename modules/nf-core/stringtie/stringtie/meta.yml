name: stringtie_stringtie
description: Transcript assembly and quantification for RNA-Se
keywords:
- transcript
- assembly
- quantification
- gtf
tools:
- stringtie2:
    description: |
      Transcript assembly and quantification for RNA-Seq
    homepage: https://ccb.jhu.edu/software/stringtie/index.shtml
    documentation: https://ccb.jhu.edu/software/stringtie/index.shtml?t=manual
    licence: ["MIT"]
    identifier: biotools:stringtie
input:
- - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - bam:
      type: file
      description: |
        Stringtie transcript gtf output(s).
      ontologies: []
- annotation_gtf:
    type: file
    description: |
      Annotation gtf file (optional).
    ontologies: []
output:
  transcript_gtf:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - "*.transcripts.gtf":
        type: file
        description: transcript gtf
        pattern: "*.{transcripts.gtf}"
        ontologies: []
  abundance:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - "*.abundance.txt":
        type: file
        description: abundance
        pattern: "*.{abundance.txt}"
        ontologies: []
  coverage_gtf:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - "*.coverage.gtf":
        type: file
        description: coverage gtf
        pattern: "*.{coverage.gtf}"
        ontologies: []
  ballgown:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - "*.ballgown/*.ctab":
        type: file
        description: Ballgown expression and transcript mapping tables
        pattern: "*.ballgown/*.ctab"
        ontologies: []
  versions_stringtie:
  - - ${task.process}:
        type: string
        description: The name of the process
    - stringtie:
        type: string
        description: The name of the tool
    - "stringtie --version":
        type: eval
        description: The expression to obtain the version of the tool

topics:
  versions:
  - - ${task.process}:
        type: string
        description: The name of the process
    - stringtie:
        type: string
        description: The name of the tool
    - "stringtie --version":
        type: eval
        description: The expression to obtain the version of the tool

authors:
- "@drpatelh"
maintainers:
- "@drpatelh"
