name: Module packaging

on:
  pull_request:
    paths:
      - "modules/local/**"
      - "modules/nf-core/**"
      - "conf/containers_*.config"
      - "nextflow.config"
      - "nf-test.config"
      - "tests/nextflow.config"
      - ".github/workflows/module-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Module metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3
        with:
          version: "25.10.4"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Check local metadata coverage and lock references
        run: |
          uv run --no-project --with pyyaml==6.0.3 python - <<'PY'
          import re
          from pathlib import Path
          import yaml

          for main in Path('modules/local').rglob('main.nf'):
              meta = yaml.safe_load(main.with_name('meta.yml').read_text())
              source = main.read_text()
              assert source.strip(), f'{main}: empty module source'
              outputs = set(re.findall(r'emit:\s*(\w+)', source))
              missing = outputs - set(meta.get('output', {}))
              assert not missing, f'{main}: undocumented outputs: {sorted(missing)}'
              extra = set(meta.get('output', {})) - outputs
              assert not extra, f'{main}: metadata describes nonexistent outputs: {sorted(extra)}'
              if re.search(r'topic:\s*versions\b', source):
                  assert meta.get('topics', {}).get('versions'), f'{main}: missing versions topic'
              for entry in meta.get('containers', {}).get('conda', {}).values():
                  lock = Path(entry['lock_file'])
                  assert not lock.is_absolute(), f'{main}: lock path must be repository-relative'
                  assert lock.is_file(), f'{main}: missing lock file: {lock}'
          PY
      - name: Check installed and local module metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from nf-core==4.1.0 nf-core modules lint --all --local --key meta_yml

  native-runtime:
    name: psirc and CIRI3 | ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            profile: docker
          - arch: arm64
            runner: ubuntu-24.04-arm
            profile: docker,arm64
    env:
      NXF_ANSI_LOG: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3
        with:
          version: "25.10.4"
      - uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2
        with:
          version: "0.9.4"
          install-pdiff: true
      - name: Test packaged tools on the native architecture
        env:
          NFT_WORKDIR: ${{ runner.temp }}/nf-test
        run: |
          nf-test test \
            modules/local/psirc \
            modules/local/psircquant \
            modules/local/ciri3 \
            --profile=+${{ matrix.profile }} \
            --ci --verbose --tap=packaging.tap
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: module-packaging-${{ matrix.arch }}
          path: |
            packaging.tap
            .nf-test.log
          if-no-files-found: ignore
